# Copy this file to: .github/workflows/ai-code-review.yml
# in any repository where you want AI code reviews

name: "🤖 AI Code Review (Optimized)"

on:
  pull_request:
    types: [opened, synchronize]
    # Optionally limit to specific branches
    # branches: [main, develop]

jobs:
  ai-code-review:
    name: "AI Code Review"
    runs-on: ubuntu-latest
    
    # Skip reviews for dependabot PRs (optional)
    if: github.actor != 'dependabot[bot]'
    
    steps:
      - name: "🚀 AI Code Review (Optimized - <2min startup)"
        uses: phoenixdataworks/llm-code-reviewer@v1.1.2-optimized
        with:
          # Required
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # Choose your AI provider (set corresponding API key)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          
          # Model selection (affects startup speed)
          PRIMARY_MODEL: 'openai'  # Fastest: ~60s startup
          # PRIMARY_MODEL: 'gemini'    # Balanced: ~75s startup  
          # PRIMARY_MODEL: 'anthropic' # Detailed: ~90s startup
          
          # Optional optimizations
          INPUT_EXCLUDE: |
            *.md
            *.json
            *.lock
            *.min.js
            *.min.css
            package-lock.json
            yarn.lock
          
          # Language for review comments
          HUMAN_LANGUAGE: 'en'
          
          # Model-specific settings
          OPENAI_MODEL: 'gpt-4o-mini'  # Fast and cost-effective
          GEMINI_MODEL: 'gemini-1.5-flash-002'
          ANTHROPIC_MODEL: 'claude-3-haiku-20240307'

# 🎯 Performance Expectations:
# - First run (cold): ~90 seconds total
# - Subsequent runs (cached): ~25 seconds total  
# - Startup time: <2 minutes (vs 13 minutes before optimization)
# - Memory usage: <200MB (vs 400MB before)
# - Zero dependency conflicts

# 📝 Setup Instructions:
# 1. Copy this file to .github/workflows/ai-code-review.yml
# 2. Add your API keys to repository secrets
# 3. Create a PR to test - expect fast, reliable reviews!

# 🐛 Troubleshooting:
# - Check action logs for performance metrics
# - Verify API keys are correctly set
# - See TESTING_GUIDE.md for comprehensive testing 